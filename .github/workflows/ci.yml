name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - macos-15
          - windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ninja autoconf autoconf-archive automake libtool

      - name: Install vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          if (Test-Path -LiteralPath $vcpkgRoot) {
              Remove-Item -LiteralPath $vcpkgRoot -Recurse -Force
          }
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
          $manifest = Get-Content (Join-Path $env:GITHUB_WORKSPACE "vcpkg.json") | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'
          if ([string]::IsNullOrWhiteSpace($baseline)) {
              throw "Le builtin-baseline est absent de vcpkg.json"
          }
          git -C $vcpkgRoot fetch --no-tags origin $baseline
          if ($IsWindows) {
              & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          } else {
              & (Join-Path $vcpkgRoot "bootstrap-vcpkg.sh") -disableMetrics
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Release (Unix)
        if: runner.os != 'Windows'
        shell: pwsh
        run: cmake --preset vcpkg-release

      - name: Configure Release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --preset vcpkg-release-windows

      - name: Build Release (Unix)
        if: runner.os != 'Windows'
        shell: pwsh
        run: cmake --build --preset vcpkg-release --parallel 2

      - name: Build Release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build --preset vcpkg-release-windows --parallel 2

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        shell: pwsh
        run: ctest --test-dir build-vcpkg-release --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir build-vcpkg-release -C Release --output-on-failure

      - name: Check installed command
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "vault-ci-install"
          cmake --install build-vcpkg-release --prefix $staging --config Release
          $binary = if ($IsWindows) {
              Join-Path $staging "bin\vault.exe"
          } else {
              Join-Path $staging "bin/vault"
          }
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "Le binaire installe est absent : $binary"
          }
