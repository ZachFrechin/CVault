name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            architecture: x64
            archive: vault-linux-x64.tar.gz
          - os: macos-13
            platform: macos
            architecture: x64
            archive: vault-macos-x64.tar.gz
          - os: macos-14
            platform: macos
            architecture: arm64
            archive: vault-macos-arm64.tar.gz
          - os: windows-latest
            platform: windows
            architecture: x64
            archive: vault-windows-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          if (Test-Path -LiteralPath $vcpkgRoot) {
              Remove-Item -LiteralPath $vcpkgRoot -Recurse -Force
          }
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
          if ($IsWindows) {
              & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          } else {
              & (Join-Path $vcpkgRoot "bootstrap-vcpkg.sh") -disableMetrics
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Release
        shell: pwsh
        run: cmake --preset vcpkg-release

      - name: Build Release
        shell: pwsh
        run: cmake --build --preset vcpkg-release --parallel 2

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build-vcpkg-release --output-on-failure

      - name: Stage installation tree
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "vault-staging"
          if (Test-Path -LiteralPath $staging) {
              Remove-Item -LiteralPath $staging -Recurse -Force
          }
          New-Item -ItemType Directory -Path $staging | Out-Null
          cmake --install build-vcpkg-release --prefix $staging

      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -C "$RUNNER_TEMP/vault-staging" -czf "$RUNNER_TEMP/${{ matrix.archive }}" .

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path (Join-Path (Join-Path $env:RUNNER_TEMP "vault-staging") "*") `
            -DestinationPath (Join-Path $env:RUNNER_TEMP "${{ matrix.archive }}")

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Build checksum file
        shell: bash
        run: |
          mkdir -p release
          find release-assets -type f \( -name 'vault-*.tar.gz' -o -name 'vault-*.zip' \) \
            -exec cp {} release/ \;
          cd release
          sha256sum vault-* > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Vault ${GITHUB_REF_NAME}" \
            --generate-notes
